app = "vera-bot"            # change to a unique name
primary_region = "bom"      # Mumbai

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # must stay up for the whole test window
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/v1/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
